<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>PixelProTech — Hardware Operations (Internal)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#050507;--dark:#0a0a0f;--card:#0f0f17;--border:#1a1a2e;--border-lit:#2a2a44;--purple:#7b2fff;--purple-dim:#5a1fd4;--teal:#00d4aa;--white:#f0f0f8;--muted:#8888aa;--dimmer:#4a4a66;--red:#ff6b6b;--amber:#efaa32;--green:#50dc64;--mono:'Space Mono',ui-monospace,monospace;--sans:'Syne',system-ui,sans-serif}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--white);font-family:var(--sans);line-height:1.5;min-height:100vh;background-image:linear-gradient(rgba(123,47,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,170,.03) 1px,transparent 1px);background-size:34px 34px}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
header.top{position:sticky;top:0;z-index:50;background:rgba(5,5,7,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 4%}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap;padding:8px 0}
.brand{font-weight:800;letter-spacing:2px;font-size:14px;text-transform:uppercase}
.brand small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--purple);font-weight:400}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tab{font-family:var(--mono);font-size:11px;letter-spacing:1px;padding:9px 16px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--muted);cursor:pointer}
.tab.on{border-color:var(--purple);color:var(--purple);background:rgba(123,47,255,.1)}
main{max-width:1280px;margin:0 auto;padding:28px 4% 80px}
.banner{font-family:var(--mono);font-size:11px;line-height:1.8;color:var(--amber);border:1px solid rgba(239,170,50,.35);background:rgba(239,170,50,.06);border-radius:6px;padding:12px 16px;margin-bottom:22px}
.banner b{color:#ffd27a}
h1{font-size:28px;font-weight:800;letter-spacing:-.8px;margin-bottom:6px}
h2{font-size:19px;font-weight:800;letter-spacing:-.4px;margin-bottom:12px}
h3{font-size:15px;font-weight:700;margin-bottom:8px}
.hud{font-family:var(--mono);font-size:10px;color:var(--teal);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.8;max-width:760px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)),var(--card);border:1px solid var(--border);border-radius:10px;padding:22px;margin-bottom:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}}
.stat{padding:18px;border:1px solid var(--border);border-radius:8px;background:var(--card)}
.stat .n{font-size:30px;font-weight:800;letter-spacing:-1px;color:var(--teal);line-height:1}
.stat .n.dim{color:var(--dimmer)}
.stat .l{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--muted);margin-top:8px;text-transform:uppercase}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fg label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
input,select,textarea{background:var(--dark);border:1px solid var(--border);border-radius:4px;padding:10px 12px;font-family:var(--mono);font-size:12px;color:var(--white);width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--purple)}
textarea{min-height:70px;resize:vertical}
select option{background:var(--dark)}
input[type=checkbox]{width:auto;accent-color:#7b2fff}
.ck{display:flex;gap:8px;align-items:flex-start;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:10px;cursor:pointer}
button,.btn{font-family:var(--mono);font-size:11px;letter-spacing:1px;padding:10px 16px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--white);cursor:pointer;text-decoration:none;display:inline-block}
button:hover{border-color:var(--teal);color:var(--teal)}
button.pri{background:var(--purple);border-color:var(--purple);color:#fff}button.pri:hover{background:var(--purple-dim);color:#fff}
button.sm{padding:6px 10px;font-size:10px}
button.warn:hover{border-color:var(--red);color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
th{text-align:left;color:var(--dimmer);font-weight:400;letter-spacing:1px;text-transform:uppercase;font-size:9px;padding:8px 6px;border-bottom:1px solid var(--border)}
td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top;color:var(--muted)}
td input,td select{padding:7px 8px;font-size:11px;min-width:70px}
.tw{overflow-x:auto}
.badge{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:3px 8px;border-radius:2px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.b-teal{color:var(--teal);border-color:rgba(0,212,170,.35);background:rgba(0,212,170,.08)}
.b-purple{color:var(--purple);border-color:rgba(123,47,255,.4);background:rgba(123,47,255,.1)}
.b-amber{color:var(--amber);border-color:rgba(239,170,50,.4);background:rgba(239,170,50,.08)}
.b-red{color:var(--red);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.08)}
.b-green{color:var(--green);border-color:rgba(80,220,100,.4);background:rgba(80,220,100,.08)}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 20px}
.msg{font-family:var(--mono);font-size:11px;padding:10px 14px;border-radius:5px;margin:10px 0;line-height:1.7}
.msg.err{color:var(--red);border:1px solid rgba(255,107,107,.35);background:rgba(255,107,107,.06)}
.msg.ok{color:var(--teal);border:1px solid rgba(0,212,170,.3);background:rgba(0,212,170,.05)}
.msg.warn{color:var(--amber);border:1px solid rgba(239,170,50,.35);background:rgba(239,170,50,.06)}
.empty{font-family:var(--mono);font-size:12px;color:var(--dimmer);text-align:center;padding:32px;border:1px dashed var(--border);border-radius:8px}
.tot td{color:var(--white)}
.tot tr.final td{font-size:14px;color:var(--teal);font-weight:700;border-top:1px solid var(--teal)}
.log{font-family:var(--mono);font-size:10px;color:var(--dimmer);line-height:1.9;max-height:220px;overflow:auto}
a{color:var(--teal)}
/* print overlay */
#printView{display:none}
#printView.on{display:block;position:fixed;inset:0;z-index:999;background:#e9e9ef;overflow:auto;padding:20px}
.pbar{max-width:800px;margin:0 auto 14px;display:flex;gap:10px}
.doc{background:#fff;color:#111;max-width:800px;margin:0 auto;padding:44px 48px;font-family:Arial,Helvetica,sans-serif;font-size:12.5px;line-height:1.55}
.doc h1{font-family:Arial,sans-serif;font-size:24px;letter-spacing:0;color:#111;margin:0}
.doc .dh{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #7b2fff;padding-bottom:14px;margin-bottom:18px}
.doc .co{font-size:11px;color:#444;line-height:1.5}
.doc .co b{font-size:14px;color:#111}
.doc h4{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#7b2fff;margin:18px 0 6px;border-bottom:1px solid #ddd;padding-bottom:3px}
.doc table{font-family:Arial,sans-serif;font-size:12px;margin-bottom:6px}
.doc th{color:#555;border-bottom:1px solid #999;font-size:10px;padding:5px 4px}
.doc td{color:#111;border-bottom:1px solid #e4e4e4;padding:5px 4px}
.doc td.r,.doc th.r{text-align:right}
.doc .kv{display:grid;grid-template-columns:150px 1fr;gap:3px 12px;margin-bottom:4px}
.doc .kv span:nth-child(odd){color:#666}
.doc .grand td{font-weight:700;font-size:14px;border-top:2px solid #111}
.doc .draft{background:#fff3cd;border:1px solid #e0b100;padding:6px 10px;font-weight:700;margin-bottom:12px}
.doc .small{font-size:10.5px;color:#555}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:34px}
.doc .sig div{border-top:1px solid #111;padding-top:4px;font-size:11px}
@media print{
 body{background:#fff!important}
 body>*:not(#printView){display:none!important}
 #printView.on{position:static;background:#fff;padding:0;overflow:visible}
 .pbar{display:none!important}
 .doc{box-shadow:none;padding:0;max-width:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">PixelProTech <small>HARDWARE OPERATIONS · INTERNAL</small></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main id="main"></main>
<div id="printView"></div>

<script>
/* =====================================================
   PixelProTech Hardware Operations — internal tool
   Local-first: data lives in THIS browser only.
   ===================================================== */
var KEY='ppt_hw_ops_v1';
var STATUSES=['Request received','Assessment required','Awaiting technical information','Sourcing components','Supplier quotations received','Client quotation prepared','Quotation sent','Awaiting client approval','Approved','Payment pending','Payment confirmed','Procurement in progress','Parts received','Delivery scheduled','Installation in progress','Testing in progress','Completed','Cancelled'];
var SUP_STATUSES=['Lead — not contacted','Contacted','Awaiting response','Verification pending','Verified','Approved for purchasing','Temporarily unavailable','Rejected'];
var CHECKLIST=[['correct','Confirm correct component'],['compat','Check compatibility'],['serials','Record serial / part numbers where applicable'],['installed','Install component'],['bios','Confirm BIOS/UEFI or operating-system detection (where relevant)'],['boot','Confirm operating-system boot'],['detect','Verify memory / storage detection'],['diag','Run appropriate diagnostics'],['stable','Confirm machine stability'],['faults','Record outstanding faults']];
var RESULTS=['','Passed','Passed with observations','Failed','Requires further investigation'];
var WTYPES=['Supplier / manufacturer hardware warranty','PixelProTech installation workmanship','Additional service agreement'];
var CLAIMS=['No claim','Claim lodged','Under assessment','Accepted','Rejected','Resolved'];
var GROUPS={
 open:['Request received','Assessment required','Awaiting technical information','Sourcing components','Supplier quotations received','Client quotation prepared'],
 await:['Quotation sent','Awaiting client approval'],
 approved:['Approved','Payment pending','Payment confirmed'],
 proc:['Procurement in progress','Parts received','Delivery scheduled'],
 install:['Installation in progress','Testing in progress'],
 done:['Completed']
};
var NEEDS_APPROVAL=['Approved','Payment pending','Payment confirmed','Procurement in progress','Parts received','Delivery scheduled','Installation in progress','Testing in progress','Completed'];

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);}
function nowTs(){return new Date().toISOString();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function r2(n){return Math.round((n+Number.EPSILON)*100)/100;}
function money(n){return 'R '+Number(n||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});}
function addDays(d,n){var x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);}

function seedSuppliers(){
  function mk(name,notes,type){return {id:uid(),name:name,type:type||'Prospective supplier',website:'',contact:'',location:'',brands:'',categories:'',trade:'',pricing:'',stock:'',delivery:'',warranty:'',returns:'',vat:'',status:SUP_STATUSES[0],verified:'',notes:notes,archived:false,created:nowTs()};}
  return [
    mk('JLS Computers','Prospective supplier lead. Not a confirmed PixelProTech partner. No details verified yet.'),
    mk('Service Parts Logistics (SPL)','Prospective supplier lead. Not a confirmed PixelProTech partner. No details verified yet.'),
    mk('TVR Distribution','Prospective supplier lead. Not a confirmed PixelProTech partner. No details verified yet.'),
    mk('ASUS South Africa authorised partner directory','BRAND-SPECIFIC VERIFICATION SOURCE — used to check whether a reseller is an authorised ASUS partner. Not automatically a direct supplier.','Verification resource')
  ];
}
function blank(){return {v:1,suppliers:seedSuppliers(),jobs:[],partners:[],offerings:[],customers:[],income:[],ienq:[],proof:[],audit:[],seq:{quote:0},settings:{vatRegistered:false,vatRate:15,payInstr:'',defPayTerms:'',defValidity:14,defWarranty:'Hardware carries the supplier / manufacturer warranty stated for each item. Installation workmanship terms are stated separately. No warranty beyond the supplier or manufacturer terms is implied.',defExclusions:'Pre-existing faults unrelated to the quoted work; loss of data not caused by PixelProTech; software licences unless itemised; work outside the agreed scope.',technicians:''}};}
var S=load();
function norm(o){o.audit=o.audit||[];o.seq=o.seq||{quote:0};['partners','offerings','customers','income','ienq','proof'].forEach(function(k){o[k]=o[k]||[];});o.settings=Object.assign(blank().settings,o.settings||{});return o;}
function load(){try{var t=localStorage.getItem(KEY);if(t){var o=JSON.parse(t);if(o&&o.jobs&&o.suppliers){return norm(o);}}}catch(e){}return blank();}
var saveFailed=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));saveFailed=false;}catch(e){saveFailed=true;alert('WARNING: could not save to this browser (storage full or blocked). Export your data now.');}}
function audit(action,jobId){S.audit.push({ts:nowTs(),action:action,job:jobId||''});if(S.audit.length>3000)S.audit=S.audit.slice(-3000);}

var ui={tab:'dash',jobId:null,jtab:'overview',filter:'all',q:'',supEdit:null,supShowArch:false,msg:'',itab:'partners',prEdit:null,pEdit:null,oEdit:null,cEdit:null,eEdit:null};
function J(){return S.jobs.find(function(j){return j.id===ui.jobId;});}
function SUP(id){return S.suppliers.find(function(s){return s.id===id;});}
function supName(id){var s=SUP(id);return s?s.name:'(none)';}

/* ---------- generic path binding ---------- */
function setPath(o,path,val){var p=path.split('.');for(var i=0;i<p.length-1;i++){if(o[p[i]]==null)o[p[i]]={};o=o[p[i]];}o[p[p.length-1]]=val;}
function getPath(o,path){return path.split('.').reduce(function(a,k){return a==null?undefined:a[k];},o);}
function F(label,scope,path,val,o){o=o||{};
  var a=' data-scope="'+scope+'" data-f="'+esc(path)+'"'+(o.sid?' data-sid="'+esc(o.sid)+'"':'')+(o.coll?' data-coll="'+o.coll+'"':'')+(o.num?' data-num="1"':'')+(o.after?' data-after="'+o.after+'"':'')+(o.re?' data-re="1"':'');
  var h='';
  if(o.type==='textarea')h='<textarea'+a+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+'>'+esc(val)+'</textarea>';
  else if(o.type==='select'){h='<select'+a+'>'+o.opts.map(function(x){var v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:x;return '<option value="'+esc(v)+'"'+(String(v)===String(val==null?'':val)?' selected':'')+'>'+esc(l)+'</option>';}).join('')+'</select>';}
  else if(o.type==='checkbox')return '<label class="ck"><input type="checkbox"'+a+(val?' checked':'')+'> <span>'+esc(label)+'</span></label>';
  else h='<input type="'+(o.type||'text')+'"'+a+' value="'+esc(val)+'"'+(o.num?' step="any" min="0"':'')+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+'>';
  if(o.bare)return h;
  return '<div class="fg"><label>'+esc(label)+'</label>'+h+'</div>';
}
function JF(label,path,o){var j=J();return F(label,'job',path,getPath(j,path),o);}
function target(t){var sc=t.dataset.scope;if(sc==='job')return J();if(sc==='set')return S.settings;if(sc==='sup')return SUP(t.dataset.sid);if(sc==='coll')return (S[t.dataset.coll]||[]).find(function(x){return x.id===t.dataset.sid;});return null;}

document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.status){changeStatus(t);return;}
  if(t.dataset&&t.dataset.pstatus!==undefined){changePartnerStatus(t);return;}
  if(!t.dataset||t.dataset.f===undefined)return;
  var o=target(t);if(!o)return;
  var v=t.type==='checkbox'?t.checked:(t.dataset.num?(parseFloat(t.value)||0):t.value);
  if(t.dataset.f==='quote.approval'){if(!approvalOk(o,v)){t.value=o.quote.approval;return;}}
  setPath(o,t.dataset.f,v);
  if(t.dataset.scope==='job'){o.updated=nowTs();audit('Edited '+t.dataset.f,o.id);}
  if(t.dataset.scope==='sup'){audit('Edited supplier field '+t.dataset.f+' ('+o.name+')');}
  if(t.dataset.scope==='coll'){audit('Edited '+t.dataset.coll+' field '+t.dataset.f+(o.name?' ('+o.name+')':''));}
  save();
  var a=t.dataset.after;
  if(a==='quote')refreshQuote();else if(a==='render')render();else if(a==='cmp')render();
});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act,id=b.dataset.id,i=b.dataset.i;
  (ACTS[act]||function(){})(id,i,b);
});

/* ---------- status workflow ---------- */
function gate(j,s){
  var q=j.quote;
  if(NEEDS_APPROVAL.indexOf(s)>-1&&!(q&&q.approval==='Approved'))return 'Cannot set "'+s+'": the client quotation has not been recorded as Approved (Quote tab).';
  if(s==='Payment confirmed'&&!j.payment.confirmed)return 'Cannot set "Payment confirmed": record the confirmed payment (date, reference, amount) on the Procurement tab first.';
  if(['Procurement in progress','Parts received','Delivery scheduled'].indexOf(s)>-1&&j.payment.requireUpfront&&!j.payment.confirmed)return 'Cannot set "'+s+'": upfront payment is required and not yet confirmed.';
  if(s==='Completed'){var r=j.install.result;if(r!=='Passed'&&r!=='Passed with observations')return 'Cannot set "Completed": the installation test result must be recorded as Passed or Passed with observations (Installation tab).';}
  return '';
}
function changeStatus(t){
  var j=J(),s=t.value,m=gate(j,s);
  if(m){alert(m);t.value=j.status;return;}
  var note=prompt('Optional note for this status change:','')||'';
  j.status=s;j.statusLog.push({ts:nowTs(),status:s,note:note});j.updated=nowTs();audit('Status → '+s,j.id);save();render();
}
function approvalOk(j,v){
  var q=j.quote;
  if(v==='Approved'){
    if(!q.approvedDate||!q.approvedBy||!q.approvalEvidence){alert('To mark the quotation Approved, first enter the approval date, who approved, and the written evidence reference (e.g. email or WhatsApp message date/ID).');return false;}
  }
  return true;
}

/* ---------- quote calc ---------- */
function lineCalc(l){
  var unit=l.cat==='Hardware'?r2((l.cost||0)*(1+(l.markup||0)/100)):(l.price||0);
  var sell=r2((l.qty||0)*unit),cost=r2((l.qty||0)*(l.cost||0));
  return {unit:unit,sell:sell,cost:cost};
}
function calcQuote(j){
  var q=j.quote,cats={Hardware:0,Installation:0,Additional:0,Delivery:0},cost=0;
  q.lines.forEach(function(l){if(l.include===false)return;var c=lineCalc(l);cats[l.cat]=r2((cats[l.cat]||0)+c.sell);cost=r2(cost+c.cost);});
  var sub=r2(cats.Hardware+cats.Installation+cats.Additional+cats.Delivery);
  var vat=S.settings.vatRegistered?r2(sub*(S.settings.vatRate||0)/100):0;
  return {cats:cats,sub:sub,vat:vat,total:r2(sub+vat),cost:cost,margin:r2(sub-cost)};
}
function refreshQuote(){
  var j=J();if(!j||!j.quote)return;
  var el=document.getElementById('qtotals');if(el)el.innerHTML=quoteTotalsHtml(j);
  j.quote.lines.forEach(function(l,i){var c=lineCalc(l);var u=document.getElementById('lu'+i),s=document.getElementById('ls'+i);if(u)u.textContent=money(c.unit);if(s)s.textContent=money(c.sell);});
}
function quoteTotalsHtml(j){
  var c=calcQuote(j),v=S.settings.vatRegistered;
  return '<table class="tot"><tr><td>Hardware</td><td style="text-align:right">'+money(c.cats.Hardware)+'</td></tr><tr><td>Installation</td><td style="text-align:right">'+money(c.cats.Installation)+'</td></tr><tr><td>Additional services</td><td style="text-align:right">'+money(c.cats.Additional)+'</td></tr><tr><td>Delivery</td><td style="text-align:right">'+money(c.cats.Delivery)+'</td></tr><tr><td>Subtotal'+(v?' (excl. VAT)':'')+'</td><td style="text-align:right">'+money(c.sub)+'</td></tr><tr><td>'+(v?'VAT @ '+S.settings.vatRate+'%':'VAT')+'</td><td style="text-align:right">'+(v?money(c.vat):'Not charged (not VAT-registered per settings)')+'</td></tr><tr class="final"><td>FINAL AMOUNT PAYABLE</td><td style="text-align:right">'+money(c.total)+'</td></tr></table>'+
  '<div class="msg warn" style="margin-top:12px">INTERNAL ONLY — procurement cost '+money(c.cost)+' · recorded margin on this quote '+money(c.margin)+(c.sub?' ('+(c.margin/c.sub*100).toFixed(1)+'%)':'')+'. Not shown on the client document.</div>';
}

/* ---------- ACTIONS ---------- */
var ACTS={
 tab:function(id){ui.tab=id;ui.jobId=null;ui.msg='';render();},
 jtab:function(id){ui.jtab=id;render();},
 openjob:function(id){ui.jobId=id;ui.jtab='overview';ui.tab='jobs';render();window.scrollTo(0,0);},
 closejob:function(){ui.jobId=null;render();},
 newjob:function(){ui.tab='jobs';ui.jobId='__new';render();},
 createjob:function(){createJob();},

/* ---------- create job / parse ---------- */
function newJobObj(ref){return {id:uid(),ref:ref,created:nowTs(),updated:nowTs(),status:STATUSES[0],statusLog:[{ts:nowTs(),status:STATUSES[0],note:'Job created'}],client:{org:'',contact:'',email:'',tel:'',loc:'',pref:''},equip:{type:'',qty:1,make:'',model:'',problem:'',ram:'',store:'',want:'',other:'',unknown:false,needs:'',files:''},notes:'',comparisons:[],quote:null,payment:{terms:'',requireUpfront:true,confirmed:false,date:'',ref:'',amount:0,method:'',instr:''},orders:[],install:{tech:'',date:'',site:'',equipId:'',parts:'',checklist:{},serials:'',outstanding:'',result:'',notes:'',evidence:[],completed:''},warranties:[]};}
function genRef(){var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r='HW-';for(var i=0;i<6;i++)r+=c[Math.floor(Math.random()*c.length)];return r;}
function parseInto(){
  var t=document.getElementById('rawreq').value;var out=document.getElementById('parsemsg');
  if(!t.trim()){out.innerHTML='<div class="msg err">Paste the request text first.</div>';return;}
  function g(label){var m=t.match(new RegExp('^'+label.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')+'\\s*(.*)$','m'));return m?m[1].trim():'';}
  var rm=t.match(/(HW-[A-Z0-9]{6})/);var ref=rm?rm[1]:genRef();
  if(S.jobs.some(function(x){return x.ref===ref;})){out.innerHTML='<div class="msg err">A job with reference '+esc(ref)+' already exists.</div>';return;}
  var j=newJobObj(ref);
  j.client={org:g('Name/Organisation:'),contact:g('Contact person:'),email:g('Email:'),tel:g('Phone:'),loc:g('Location:'),pref:g('Preferred contact:')};
  var needs=g('Needs quoted:');
  j.equip={type:g('Equipment type:'),qty:parseInt(g('Number of machines:'),10)||1,make:g('Manufacturer:'),model:g('Model:'),problem:g('Problem / requirement:'),ram:g('Existing RAM:'),store:g('Existing storage:'),want:g('Desired upgrade:'),other:g('Other info:'),unknown:/Client does not know which component/.test(t),needs:needs==='—'?'':needs,files:g('Files I will send separately:')};
  if(j.equip.unknown){j.status='Assessment required';j.statusLog.push({ts:nowTs(),status:j.status,note:'Client asked for requirements assessment'});}
  j.notes='Imported from client request text on '+today()+'.';
  S.jobs.unshift(j);audit('Job created from pasted request '+ref,j.id);save();ui.jobId=j.id;ui.jtab='overview';render();
}
function createJob(){
  var org=(document.getElementById('nj-org').value||'').trim();
  if(!org){document.getElementById('parsemsg').innerHTML='<div class="msg err">Enter at least a client name.</div>';return;}
  var j=newJobObj(genRef());j.client.org=org;j.client.contact=(document.getElementById('nj-contact').value||'').trim();j.client.tel=(document.getElementById('nj-tel').value||'').trim();
  S.jobs.unshift(j);audit('Job created manually '+j.ref,j.id);save();ui.jobId=j.id;ui.jtab='overview';render();
}

/* ---------- procurement ---------- */
function recordPayment(){
  var j=J(),d=document.getElementById('pay-date').value,r=document.getElementById('pay-ref').value.trim(),a=parseFloat(document.getElementById('pay-amt').value),m=document.getElementById('pay-method').value.trim();
  if(!d||!r||!(a>0)){alert('To confirm payment you must enter the date received, a payment reference (bank/EFT/receipt reference) and the amount actually received. Payment is never marked received without these.');return;}
  j.payment.confirmed=true;j.payment.date=d;j.payment.ref=r;j.payment.amount=a;j.payment.method=m;audit('Payment confirmed '+money(a)+' ref '+r,j.id);save();render();
}
function addOrder(){
  var j=J(),q=j.quote;
  if(!q||q.approval!=='Approved'){alert('Blocked: no supplier order may be recorded until the client quotation is Approved.');return;}
  if(j.payment.requireUpfront&&!j.payment.confirmed){alert('Blocked: upfront payment is required for this job and has not been confirmed. Record the confirmed payment first (or switch off "upfront payment required" for this job if different terms were agreed in writing).');return;}
  var sid=document.getElementById('ord-sup').value;
  if(!sid){alert('Select a supplier.');return;}
  var s=SUP(sid);
  if(s.status!=='Approved for purchasing'){alert('Blocked: supplier "'+s.name+'" has status "'+s.status+'". Only suppliers with status "Approved for purchasing" can receive orders. Update the supplier record first.');return;}
  j.orders.push({id:uid(),supplier:sid,orderRef:'',invoiceRef:'',date:today(),cost:0,expected:'',status:'Ordered',receivedDate:'',received:''});
  audit('Supplier order started with '+s.name,j.id);save();render();
}

/* ---------- export / import ---------- */
function exportData(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pixelprotech-hardware-ops-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
  audit('Exported data');save();
}
function importData(file){
  var r=new FileReader();r.onload=function(){
    try{var o=JSON.parse(r.result);if(!o||!Array.isArray(o.jobs)||!Array.isArray(o.suppliers))throw new Error('Not a valid export file.');
      if(!confirm('Import will REPLACE the data in this browser with the file contents ('+o.jobs.length+' jobs, '+o.suppliers.length+' suppliers). A copy of the current data is kept in this browser as a safety backup. Continue?'))return;
      try{localStorage.setItem(KEY+'_prev',JSON.stringify(S));}catch(e){}
      S=norm(o);audit('Imported data');save();render();alert('Import complete.');
    }catch(e){alert('Import failed: '+e.message);}
  };r.readAsText(file);
}

  m.innerHTML=h;

  S.jobs.forEach(function(j){if(j.payment.confirmed){rev=r2(rev+(j.payment.amount||0));paidJobs++;}j.orders.forEach(function(o){cost=r2(cost+(o.cost||0));});});
  function st(v,l){return '<div class="stat"><div class="n'+(v===0?' dim':'')+'">'+v+'</div><div class="l">'+l+'</div></div>';}
  function mo(v,l,has){return '<div class="stat"><div class="n'+(has?'':' dim')+'">'+(has?money(v):'—')+'</div><div class="l">'+l+'</div></div>';}
  var h='<div class="hud">// Hardware supply &amp; installation</div><h1>Operations dashboard</h1><p class="sub">Figures below are counted from records you have entered. Nothing is estimated or pre-filled.</p><div style="height:18px"></div>';

  h+='<div class="grid g4">'+st(count('open'),'Open quotation requests')+st(count('await'),'Quotations awaiting approval')+st(count('approved'),'Approved jobs')+st(count('proc'),'Procurement in progress')+st(count('install'),'Installations awaiting completion')+st(count('done'),'Completed jobs')+mo(rev,'Recorded revenue (confirmed payments)',paidJobs>0)+mo(cost,'Recorded supplier costs',S.jobs.some(function(j){return j.orders.some(function(o){return o.cost>0;});}))+'</div>';

  h+='<div style="height:14px"></div><div class="grid g2"><div class="stat"><div class="n'+(mj.length?'':' dim')+'">'+(mj.length?money(r2(mr-mc)):'—')+'</div><div class="l">Recorded gross margin '+(mj.length?'('+mj.length+' job(s) with both payment and cost recorded; includes VAT in payment if charged)':'(needs a job with confirmed payment and recorded supplier cost)')+'</div></div><div class="stat"><div class="n'+(S.suppliers.filter(function(s){return s.status==='Approved for purchasing'&&!s.archived;}).length?'':' dim')+'">'+S.suppliers.filter(function(s){return s.status==='Approved for purchasing'&&!s.archived;}).length+'</div><div class="l">Suppliers approved for purchasing (of '+S.suppliers.filter(function(s){return !s.archived;}).length+' active)</div></div></div>';
  var t0=today(),due=S.customers.filter(function(c){return c.status==='Active'&&c.renewal&&c.renewal<=addDays(t0,60);}).length;

  return h;

function partnerGate(p,s){
  if(s==='Approved'||s==='Active partner'){
    if(!p.website)return 'Cannot set "'+s+'": record the partner\'s official website first (only companies with a verifiable official website may be registered as approved).';
    if(!p.approvalEvidence||!p.approvedDate)return 'Cannot set "'+s+'": record the written approval date and the evidence reference (email / contract / programme dashboard confirmation). PixelProTech may not call itself an authorised partner before written approval.';
    if(!p.verified)return 'Cannot set "'+s+'": set the last verification date after checking the terms against the company\'s official sources.';

  S.proof.forEach(function(p){
    var open=ui.prEdit===p.id,why=proofPublishable(p);
    h+='<div class="panel"><div class="row"><div><h3 style="margin:0">'+esc(p.title||'Untitled')+'</h3><div class="row" style="margin-top:6px"><span class="badge">'+esc(p.type)+'</span><span class="badge '+(p.permission===PPERM[0]?'b-red':'b-green')+'">'+esc(p.permission)+'</span>'+(p.listed&&!why?'<span class="badge b-teal">LISTED</span>':'<span class="badge b-amber">NOT PUBLISHED</span>')+'</div></div><div class="sp"></div><button class="sm" data-act="prfedit" data-id="'+p.id+'">'+(open?'CLOSE':'EDIT')+'</button></div>';
    if(open){
      function X(l,k,o){return CF('proof',p,l,k,o);}
      h+='<div style="height:14px"></div><div class="grid g3">'+X('Type','type',{type:'select',opts:PTYPES,after:'render'})+X('Title','title',{after:'render'})+X('Area (suburb / town only)','location')+X('Date','date',{type:'date'})+X('Photo file name (same folder as index.html)','image',{ph:'e.g. lab-upgrade.jpg'})+X('Client name to show (only if permitted)','client')+'</div>'+X('Summary / client\'s own words','summary',{type:'textarea'})+'<div class="grid g3">'+X('Client permission','permission',{type:'select',opts:PPERM,after:'render'})+X('Permission reference','permissionRef',{ph:'email date / WhatsApp / signed form'})+X('Internal reference (never published)','internalRef')+'</div>';
      if(p.type==='Client testimonial'){
        h+='<div class="panel" style="background:var(--dark)"><h3>Confirm the reviewer is a real customer</h3><div class="grid g3">'+(p.reviewerContact?'<div class="fg"><label>Contact they gave (internal)</label><div style="padding:10px 0;font-family:var(--mono);font-size:12px;color:var(--teal)">'+esc(p.reviewerContact)+'</div></div>':'')+X('Rating (1–5)','rating',{num:1,type:'number',after:'render'})+X('Linked job','verifiedJob',{type:'select',opts:jobOptions(),after:'render'})+'</div>'+X('Confirmed another way (e.g. pre-system job)','verifiedOther',{type:'checkbox',after:'render'})+(p.verifiedOther?X('How you confirmed it','verifiedNote',{ph:'e.g. called client on 9 Nov, invoice #…'}):'')+'<p class="sub">Do not publish a review you cannot tie to a real job. Reviews are published exactly as written; do not edit the words. A low rating is still a genuine review — publishing only the good ones is selective, so keep your approach consistent.</p></div>';
      }
      if(why)h+='<div class="msg warn">Cannot be listed: '+esc(why)+'.</div>';
      h+='<label class="ck"><input type="checkbox" data-scope="coll" data-coll="proof" data-sid="'+p.id+'" data-f="listed" data-after="render"'+(p.listed?' checked':'')+(why?' disabled':'')+'> <span>Include in public export</span></label>';
    }
    h+='</div>';
  });
  var out=S.proof.filter(function(p){return p.listed&&!proofPublishable(p);}).map(function(p){var x={type:p.type,title:p.title};if(p.location)x.location=p.location;if(p.date)x.date=p.date;if(p.summary)x.summary=p.summary;if(p.image)x.image=p.image;if(p.type==='Client testimonial'&&p.rating>0)x.rating=p.rating;if(p.permission===PPERM[2]&&p.client)x.client=p.client;return x;});
  h+='<div class="panel"><h2>Public export</h2><p class="sub" style="margin-bottom:10px">Paste into the <b>PROOF_ITEMS</b> line in index.html and re-upload it. Upload any photo files into the same folder (flat, no subfolders). Internal references and anonymous clients\' names are never exported.</p><textarea readonly style="min-height:120px" onclick="this.select()">var PROOF_ITEMS = '+esc(JSON.stringify(out,null,2))+';</textarea></div>';
  return h;
}

/* ---------- client documents ---------- */
function docHead(title,sub){return '<div class="dh"><div><h1>'+esc(title)+'</h1><div class="small">'+esc(sub)+'</div></div><div class="co" style="text-align:right"><b>PixelProTech Solutions (Pty) Ltd</b><br>Reg. 2026/622131/07<br>Centurion, Gauteng<br>065 197 1461<br>pixelprotechsolutions@proton.me</div></div>';}
function showPrint(html){var p=document.getElementById('printView');p.innerHTML='<div class="pbar"><button class="pri" data-act="doprint">PRINT / SAVE AS PDF</button><button data-act="closeprint">CLOSE</button></div><div class="doc">'+html+'</div>';p.className='on';p.scrollTop=0;}
function printQuote(){
  var j=J(),q=j.quote;if(!q)return;
  var c=calcQuote(j),v=S.settings.vatRegistered;
  function sect(cat,label){var ls=q.lines.filter(function(l){return l.cat===cat&&l.include!==false;});if(!ls.length)return '';
    return '<h4>'+label+'</h4><table><tr><th>Description</th>'+(cat==='Hardware'?'<th>Type</th>':'')+'<th class="r">Qty</th><th class="r">Unit price</th><th class="r">Amount</th></tr>'+ls.map(function(l){var x=lineCalc(l);return '<tr><td>'+esc(l.desc)+'</td>'+(cat==='Hardware'?'<td>'+esc(l.cond&&l.cond!=='Unspecified'?l.cond:'—')+'</td>':'')+'<td class="r">'+esc(l.qty)+'</td><td class="r">'+money(x.unit)+'</td><td class="r">'+money(x.sell)+'</td></tr>';}).join('')+'</table>';}
  var valid=q.issued&&q.validDays?addDays(q.issued,Math.round(q.validDays)):'';
  var h=docHead('QUOTATION','No. '+q.number+' · Issued '+q.issued);
  if(q.approval==='Draft')h='<div class="draft">DRAFT — not yet issued to client</div>'+h;
  h+='<h4>Prepared for</h4><div class="kv"><span>Client</span><span>'+esc(j.client.org)+'</span><span>Contact</span><span>'+esc(j.client.contact)+'</span><span>Email / phone</span><span>'+esc(j.client.email)+' · '+esc(j.client.tel)+'</span><span>Location</span><span>'+esc(j.client.loc)+'</span><span>Request ref</span><span>'+esc(j.ref)+'</span></div>';
  if(q.scope)h+='<h4>Scope of work</h4><div style="white-space:pre-wrap">'+esc(q.scope)+'</div>';
  h+=sect('Hardware','Hardware')+sect('Installation','Installation')+sect('Additional','Additional services')+sect('Delivery','Delivery');
  h+='<h4>Totals</h4><table><tr><td>Hardware</td><td class="r">'+money(c.cats.Hardware)+'</td></tr><tr><td>Installation</td><td class="r">'+money(c.cats.Installation)+'</td></tr><tr><td>Additional services</td><td class="r">'+money(c.cats.Additional)+'</td></tr><tr><td>Delivery</td><td class="r">'+money(c.cats.Delivery)+'</td></tr><tr><td>Subtotal</td><td class="r">'+money(c.sub)+'</td></tr>'+(v?'<tr><td>VAT @ '+esc(S.settings.vatRate)+'%</td><td class="r">'+money(c.vat)+'</td></tr>':'')+'<tr class="grand"><td>TOTAL PAYABLE</td><td class="r">'+money(c.total)+'</td></tr></table>'+(v?'':'<div class="small">No VAT is charged on this quotation.</div>');
  h+='<h4>Terms</h4><div class="kv"><span>Valid until</span><span>'+esc(valid||'—')+'</span><span>Estimated delivery</span><span>'+esc(q.delivery||'To be confirmed on approval')+'</span><span>Payment terms</span><span style="white-space:pre-wrap">'+esc(q.payTerms||'To be agreed')+'</span></div>';
  if(S.settings.payInstr)h+='<h4>Payment instructions</h4><div style="white-space:pre-wrap">'+esc(S.settings.payInstr)+'</div>';
  h+='<h4>Warranty</h4><div style="white-space:pre-wrap">'+esc(q.warranty)+'</div><h4>Exclusions &amp; conditions</h4><div style="white-space:pre-wrap">'+esc(q.exclusions)+'</div>';
  h+='<div class="small" style="margin-top:12px">Prices are based on supplier quotations and may change if the quotation expires. Hardware is ordered only after written approval and the agreed payment terms are met.</div>';
  h+='<h4>Acceptance</h4><div class="sig"><div>Client name &amp; signature</div><div>Date</div></div>';
  showPrint(h);
}
function printReport(){
  var j=J(),I=j.install;
  var draft=(I.result!=='Passed'&&I.result!=='Passed with observations');
  var h=docHead('INSTALLATION & HANDOVER REPORT','Job '+j.ref+(I.completed?' · Completed '+I.completed:''));
  if(draft)h='<div class="draft">DRAFT — final test result '+(I.result?'is "'+esc(I.result)+'"':'has not been recorded')+'. This is not a completion certificate.</div>'+h;
  h+='<h4>Client &amp; site</h4><div class="kv"><span>Client</span><span>'+esc(j.client.org)+'</span><span>Contact</span><span>'+esc(j.client.contact)+'</span><span>Site address</span><span>'+esc(I.site||j.client.loc)+'</span><span>Equipment</span><span>'+esc([j.equip.make,j.equip.model].filter(Boolean).join(' ')||j.equip.type)+(I.equipId?' · '+esc(I.equipId):'')+'</span><span>Technician</span><span>'+esc(I.tech||'—')+'</span><span>Scheduled date</span><span>'+esc(I.date||'—')+'</span></div>';
  h+='<h4>Work performed</h4><table><tr><th>Step</th><th>Done</th><th>Note</th></tr>'+CHECKLIST.map(function(c){var v=I.checklist[c[0]]||{};return '<tr><td>'+esc(c[1])+'</td><td>'+(v.done?'Yes':'No')+'</td><td>'+esc(v.note||'')+'</td></tr>';}).join('')+'</table>';
  var recv=j.orders.filter(function(o){return o.received;});
  h+='<h4>Parts installed</h4>'+(I.parts?'<div style="white-space:pre-wrap">'+esc(I.parts)+'</div>':'<div class="small">None recorded.</div>')+(recv.length?'<div class="small" style="margin-top:6px">Components received: '+recv.map(function(o){return esc(o.received);}).join(' | ')+'</div>':'');
  h+='<h4>Test result</h4><div class="kv"><span>Technician-recorded outcome</span><span><b>'+esc(I.result||'Not yet recorded')+'</b></span></div>'+(I.notes?'<div style="white-space:pre-wrap">'+esc(I.notes)+'</div>':'');
  h+='<h4>Outstanding issues</h4><div style="white-space:pre-wrap">'+esc(I.outstanding||'None recorded.')+'</div>';
  h+='<h4>Warranty details</h4>'+(j.warranties.length?'<table><tr><th>Item</th><th>Type</th><th>Supplier</th><th>Ref</th><th>Expires</th></tr>'+j.warranties.map(function(w){return '<tr><td>'+esc(w.component)+'</td><td>'+esc(w.type)+'</td><td>'+esc(w.supplier?supName(w.supplier):'—')+'</td><td>'+esc(w.supRef||'—')+'</td><td>'+esc(warExpiry(w)||'—')+'</td></tr>';}).join('')+'</table>':'<div class="small">No warranty records entered.</div>')+'<div class="small">Hardware warranty is limited to the supplier / manufacturer terms stated above.</div>';
  h+='<h4>Completion</h4><div class="kv"><span>Completion date</span><span>'+esc(I.completed||'—')+'</span><span>Technician</span><span>'+esc(I.tech||'—')+'</span></div><div class="sig"><div>Technician signature</div><div>Client name, signature &amp; date</div></div>';
  showPrint(h);
}

render();
</script>
